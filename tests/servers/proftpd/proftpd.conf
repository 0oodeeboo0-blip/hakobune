ServerName "Hakobune test"
ServerType standalone
DefaultServer on
DefaultAddress 127.0.0.1
Port 2123
UseIPv6 off
User nobody
Group nogroup
Umask 022
MaxInstances 200
PassivePorts 40200 40299
MasqueradeAddress 127.0.0.1
RequireValidShell off
UseReverseDNS off
WtmpLog off
AllowOverwrite on
AllowStoreRestart on
AllowRetrieveRestart on
PidFile /run/proftpd-hakobune.pid
ScoreboardFile /run/proftpd-hakobune.scoreboard
SystemLog /var/log/proftpd-hakobune.log
TransferLog /var/log/proftpd-hakobune-xfer.log
