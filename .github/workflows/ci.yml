name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: エンジンのテスト (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: ビルド
        run: |
          dotnet build tests/Hakobune.Core.Tests/Hakobune.Core.Tests.csproj -c Release
          dotnet build tests/Hakobune.Presentation.Tests/Hakobune.Presentation.Tests.csproj -c Release

      - name: テスト（転送の仕組み）
        run: dotnet run --project tests/Hakobune.Core.Tests/Hakobune.Core.Tests.csproj -c Release --no-build

      - name: テスト（画面の動き）
        run: dotnet run --project tests/Hakobune.Presentation.Tests/Hakobune.Presentation.Tests.csproj -c Release --no-build

  integration:
    name: 実サーバーでのテスト (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: テスト用のサーバーを起動
        run: bash tests/servers/start.sh

      - name: ビルド
        run: |
          dotnet build tests/Hakobune.Core.Tests/Hakobune.Core.Tests.csproj -c Release
          dotnet build tests/Hakobune.Presentation.Tests/Hakobune.Presentation.Tests.csproj -c Release

      - name: テスト
        env:
          HAKOBUNE_TEST_VSFTPD: ftp://hakobune:hakobune-pass@127.0.0.1:2121
          HAKOBUNE_TEST_VSFTPD_FTPES: ftpes://hakobune:hakobune-pass@127.0.0.1:2121
          HAKOBUNE_TEST_PUREFTPD: ftp://hakobune:hakobune-pass@127.0.0.1:2122
          HAKOBUNE_TEST_PROFTPD: ftp://hakobune:hakobune-pass@127.0.0.1:2123
          HAKOBUNE_TEST_SFTP: sftp://hakobune:hakobune-pass@127.0.0.1:2222
        run: dotnet run --project tests/Hakobune.Core.Tests/Hakobune.Core.Tests.csproj -c Release --no-build

      # 同期の比べ方（送った直後は何も送らない、変えたものだけ送る）を、本物のサーバーで確かめる
      - name: 同期のテスト
        env:
          HAKOBUNE_TEST_VSFTPD: ftp://hakobune:hakobune-pass@127.0.0.1:2121
          HAKOBUNE_TEST_PUREFTPD: ftp://hakobune:hakobune-pass@127.0.0.1:2122
          HAKOBUNE_TEST_PROFTPD: ftp://hakobune:hakobune-pass@127.0.0.1:2123
          HAKOBUNE_TEST_SFTP: sftp://hakobune:hakobune-pass@127.0.0.1:2222
        run: >-
          dotnet run --project tests/Hakobune.Presentation.Tests/Hakobune.Presentation.Tests.csproj -c Release --no-build
          -- -class Hakobune.Presentation.Tests.Integration.SyncIntegrationTests

      - name: サーバーのログ
        if: failure()
        run: |
          for name in vsftpd pureftpd proftpd sshd; do
            echo "::group::$name"
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "hakobune-$name" || true
            docker logs "hakobune-$name" 2>&1 | tail -n 100 || true
            mkdir -p "logs/$name"
            docker cp "hakobune-$name:/var/log/." "logs/$name" 2>/dev/null || true
            find "logs/$name" -name '*hakobune*.log' -exec tail -n 200 {} + || true
            echo "::endgroup::"
          done

  app:
    name: アプリのビルド (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write # 画面写真を screenshots ブランチに置くため
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 発行
        run: dotnet publish src/Hakobune.App/Hakobune.App.csproj -c Release -r win-x64 -p:Platform=x64 -o publish/Hakobune-win-x64

      - name: 成果物を保存
        uses: actions/upload-artifact@v6
        with:
          name: Hakobune-win-x64
          path: publish/Hakobune-win-x64
          if-no-files-found: error

      # ランナーの画面は 1024x768 なので、1280x800 のウインドウが収まるように広げる
      # （Windows PowerShell 5.1 は UTF-8 の日本語を読み違えるので、日本語を書くステップは pwsh で動かす）
      - name: 画面の解像度を上げる
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Display
          {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE
              {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
                  public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
                  public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
                  public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
              }

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern bool EnumDisplaySettings(string deviceName, int modeNum, ref DEVMODE devMode);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);

              public static int Set(int width, int height)
              {
                  var mode = new DEVMODE();
                  mode.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  if (!EnumDisplaySettings(null, -1, ref mode))
                      return -100;
                  mode.dmPelsWidth = width;
                  mode.dmPelsHeight = height;
                  mode.dmFields = 0x80000 | 0x100000;
                  return ChangeDisplaySettings(ref mode, 0);
              }
          }
          '@
          Write-Host "ChangeDisplaySettings: $([Display]::Set(1920, 1080))（0 なら成功）"
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "画面: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      # 起動してすぐ落ちないかを確かめ、画面写真を撮る
      - name: 起動テストと画面写真
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish\Hakobune-win-x64\Hakobune.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "アプリが起動直後に終了しました (終了コード $($p.ExitCode))"
            exit 1
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $bmp.Save((Join-Path $PWD 'screenshots\startup.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()
          Stop-Process -Id $p.Id -Force

      # 保存した設定（ダーク、コンパクト、接続先の一覧を閉じる、ウインドウの位置）で起動し、画面全体を撮る。
      # ふつうに閉じて、設定が書き戻される（開いていたフォルダも覚える）ことを確かめる。
      - name: 設定の読み込みと保存のテスト
        shell: pwsh
        run: |
          $data = Join-Path $env:APPDATA 'Hakobune'
          $settings = Join-Path $data 'settings.json'
          New-Item -ItemType Directory -Force $data | Out-Null
          $saved = [ordered]@{
            Theme = 'Dark'; UseCompactRows = $true; IsSidebarOpen = $false
            Window = [ordered]@{ X = 160; Y = 90; Width = 1400; Height = 860; IsMaximized = $false }
          }
          $saved | ConvertTo-Json | Set-Content -Path $settings -Encoding utf8
          $exe = Join-Path $PWD 'publish\Hakobune-win-x64\Hakobune.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "アプリが起動直後に終了しました (終了コード $($p.ExitCode))"
            exit 1
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $bmp.Save((Join-Path $PWD 'screenshots\startup-saved-settings.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()

          # ×ボタンと同じように閉じる（WM_CLOSE）
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(30000)) {
            Stop-Process -Id $p.Id -Force
            Write-Error 'ふつうに閉じられませんでした'
            exit 1
          }
          $after = Get-Content $settings -Raw
          Write-Host $after
          $json = $after | ConvertFrom-Json
          $failed = $false
          if ($json.Theme -ne 'Dark' -or -not $json.UseCompactRows -or $json.IsSidebarOpen) {
            Write-Host '::error::選んでいた設定が保存し直されませんでした'
            $failed = $true
          }
          if (-not $json.LastLocalFolder) {
            Write-Host '::error::開いていたフォルダが保存されませんでした'
            $failed = $true
          }
          if ($json.Window.X -ne 160 -or $json.Window.Y -ne 90 -or $json.Window.Width -ne 1400 -or $json.Window.Height -ne 860) {
            Write-Host "::error::ウインドウの位置と大きさが前回のままではありません: $($json.Window | ConvertTo-Json -Compress)"
            $failed = $true
          }
          # このあとのテストは、設定の無い状態から始める
          Remove-Item $settings -Force
          if ($failed) {
            exit 1
          }

      # 見本のデータで画面を出し、アプリ自身に画面写真を撮らせる（ライト・ダーク・一覧の更新に失敗した場面・取り直して行が光る場面・ダイアログ）
      - name: 見本の画面写真
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish\Hakobune-win-x64\Hakobune.exe'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $shots = @(
            @{ Name = 'main-light'; Args = '--demo --theme light' },
            @{ Name = 'main-dark-stale'; Args = '--demo --scenario stale --theme dark' },
            @{ Name = 'main-light-stale'; Args = '--demo --scenario stale --theme light' },
            @{ Name = 'main-log-dark'; Args = '--demo --log --theme dark' },
            @{ Name = 'main-backups'; Args = '--demo --backups --theme light --size 1280x900' },
            @{ Name = 'main-update'; Args = '--demo --update --theme dark' },
            @{ Name = 'main-light-refreshed'; Args = '--demo --scenario refreshed --theme light --size 1280x900' },
            @{ Name = 'main-dark-refreshed'; Args = '--demo --scenario refreshed --theme dark --size 1280x900' },
            @{ Name = 'dialog-new-connection'; Args = '--dialog new --theme light' },
            @{ Name = 'dialog-edit-dark'; Args = '--dialog edit --theme dark' },
            @{ Name = 'dialog-quick-connect'; Args = '--dialog quick --theme light' },
            @{ Name = 'dialog-passphrase-dark'; Args = '--dialog passphrase --theme dark' },
            @{ Name = 'dialog-password'; Args = '--dialog password --theme light' },
            @{ Name = 'dialog-hostkey'; Args = '--dialog hostkey --theme light' },
            @{ Name = 'dialog-hostkey-changed'; Args = '--dialog hostkey-changed --theme dark' },
            @{ Name = 'dialog-certificate'; Args = '--dialog certificate --theme light' },
            @{ Name = 'dialog-rename'; Args = '--dialog rename --theme light' },
            @{ Name = 'dialog-delete-files-dark'; Args = '--dialog delete-files --theme dark' },
            @{ Name = 'dialog-permissions'; Args = '--dialog permissions --theme light' },
            @{ Name = 'dialog-conflict'; Args = '--dialog conflict --theme light' },
            @{ Name = 'dialog-stop-dark'; Args = '--dialog stop --theme dark' },
            @{ Name = 'dialog-settings'; Args = '--dialog settings --theme light' },
            @{ Name = 'dialog-settings-dark'; Args = '--dialog settings --theme dark' },
            @{ Name = 'dialog-settings-exclusions'; Args = '--dialog settings-exclusions --theme light --size 1280x900' },
            @{ Name = 'dialog-sync'; Args = '--dialog sync --theme light --size 1280x1000' },
            @{ Name = 'dialog-sync-dark'; Args = '--dialog sync-delete --theme dark --size 1280x1000' },
            @{ Name = 'dialog-restore'; Args = '--dialog restore --theme light' },
            @{ Name = 'dialog-ffftp'; Args = '--dialog ffftp --theme light --size 1280x900' }
          )
          $failed = $false
          foreach ($shot in $shots) {
            $png = Join-Path $PWD "screenshots\$($shot.Name).png"
            $p = Start-Process -FilePath $exe -ArgumentList "$($shot.Args) --screenshot `"$png`"" -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) {
              Stop-Process -Id $p.Id -Force
              Write-Host "::error::$($shot.Name): 時間内に終わりませんでした"
              $failed = $true
            }
            if (Test-Path "$png.error.txt") {
              Write-Host "::error::$($shot.Name): アプリがエラーを記録しました"
              Get-Content "$png.error.txt"
              $failed = $true
            }
            if (Test-Path $png) {
              Write-Host "$($shot.Name): $((Get-Item $png).Length) バイト (終了コード $($p.ExitCode))"
            } else {
              Write-Host "::error::$($shot.Name): 画面写真がありません (終了コード $($p.ExitCode))"
              $failed = $true
            }
          }
          if ($failed) {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2 } -MaxEvents 10 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "---- $($_.TimeCreated) $($_.ProviderName)"; Write-Host $_.Message }
            exit 1
          }

      # 本物の FTP サーバー（pyftpdlib）にクイック接続し、フォルダをアップロードして、サーバーに全部届いたかを確かめる。
      # 日本語のファイル名も確かめる。終わった画面を写真に撮る。
      - name: 接続と転送のテスト
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pyftpdlib
          $root = Join-Path $env:RUNNER_TEMP 'ftp-root'
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($dir in @('css', 'images', '商品写真', 'お知らせ')) {
            New-Item -ItemType Directory -Force (Join-Path $root $dir) | Out-Null
          }
          $files = [ordered]@{
            'index.html' = 18300; 'about.html' = 9100; 'お問い合わせ.html' = 12100; 'robots.txt' = 120
            'logo.png' = 46800; '見積書_2026年11月.pdf' = 245760; 'backup.zip' = 134637158
          }
          foreach ($name in $files.Keys) {
            $stream = [System.IO.File]::Create((Join-Path $root $name))
            $stream.SetLength($files[$name])
            $stream.Dispose()
          }

          $out = Join-Path $env:RUNNER_TEMP 'ftp-out.log'
          $log = Join-Path $env:RUNNER_TEMP 'ftp.log'
          $server = Start-Process -FilePath python -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $log `
            -ArgumentList @('-m', 'pyftpdlib', '-i', '127.0.0.1', '-p', '2121', '-u', 'hakobune', '-P', 'hakobune-pass', '-d', $root, '-w')
          $ready = $false
          for ($i = 0; $i -lt 40 -and -not $ready; $i++) {
            try {
              $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 2121)
              $client.Dispose()
              $ready = $true
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $ready) {
            Get-Content $log, $out -ErrorAction SilentlyContinue
            Write-Error 'FTP サーバーが起動しませんでした'
            exit 1
          }

          # 送るフォルダ（日本語の名前と、入れ子のフォルダと、空のフォルダを含む）
          $upload = Join-Path $env:RUNNER_TEMP '公開用'
          New-Item -ItemType Directory -Force (Join-Path $upload '画像'), (Join-Path $upload 'css'), (Join-Path $upload '空のフォルダ') | Out-Null
          $sent = [ordered]@{
            'トップページ.html' = 20480; 'about.html' = 4096; 'css\site.css' = 2048
            '画像\商品_01.jpg' = 1048576; '画像\商品_02.jpg' = 786432; '画像\ロゴ.png' = 30000
          }
          foreach ($name in $sent.Keys) {
            $bytes = New-Object byte[] $sent[$name]
            (New-Object System.Random 42).NextBytes($bytes)
            [System.IO.File]::WriteAllBytes((Join-Path $upload $name), $bytes)
          }

          $exe = Join-Path $PWD 'publish\Hakobune-win-x64\Hakobune.exe'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $png = Join-Path $PWD 'screenshots\connected.png'
          $p = Start-Process -FilePath $exe -ArgumentList "--connect ftp://hakobune:hakobune-pass@127.0.0.1:2121/ --upload `"$upload`" --theme light --screenshot `"$png`"" -PassThru
          $null = $p.Handle
          $finished = $p.WaitForExit(180000)
          if (-not $finished) {
            Stop-Process -Id $p.Id -Force
          }
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          Write-Host '---- FTP サーバーのログ'
          Get-Content $log -Tail 60 -ErrorAction SilentlyContinue
          $failed = $false
          if (-not $finished) {
            Write-Host '::error::接続した画面: 時間内に終わりませんでした'
            $failed = $true
          }
          if (Test-Path "$png.error.txt") {
            Write-Host '::error::接続した画面: アプリがエラーを記録しました'
            Get-Content "$png.error.txt"
            $failed = $true
          }
          if (Test-Path $png) {
            Write-Host "接続した画面: $((Get-Item $png).Length) バイト (終了コード $($p.ExitCode))"
          } else {
            Write-Host "::error::接続した画面: 画面写真がありません (終了コード $($p.ExitCode))"
            $failed = $true
          }
          # 送ったファイルが、同じ大きさ・同じ中身でサーバーに届いたか
          foreach ($name in $sent.Keys) {
            $local = Join-Path $upload $name
            $remote = Join-Path (Join-Path $root '公開用') $name
            if (-not (Test-Path $remote)) {
              Write-Host "::error::サーバーに届いていません: $name"
              $failed = $true
            } elseif ((Get-FileHash $local).Hash -ne (Get-FileHash $remote).Hash) {
              Write-Host "::error::中身が違います: $name"
              $failed = $true
            } else {
              Write-Host "届きました: $name ($((Get-Item $remote).Length) バイト)"
            }
          }
          if (-not (Test-Path (Join-Path $root '公開用\空のフォルダ') -PathType Container)) {
            Write-Host '::error::空のフォルダがサーバーに作られていません'
            $failed = $true
          } else {
            Write-Host '届きました: 空のフォルダ'
          }
          if ($failed) {
            exit 1
          }

      # 本物のマウスの操作で、一覧を囲んで選ぶ（ローカル）、端の外まで引いて流しながら選ぶ（サーバー）、名前を掴んでファイルをドラッグする。
      # 途中と終わりの画面を撮り、見出しの「N 個を選択」で、選べた数を確かめる（座標は 1280x800 の見本の画面のもの）。
      - name: マウスで囲んで選ぶテスト
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Input
          {
              [StructLayout(LayoutKind.Sequential)]
              public struct POINT { public int X; public int Y; }

              [DllImport("user32.dll")] private static extern bool ClientToScreen(IntPtr hwnd, ref POINT point);
              [DllImport("user32.dll")] private static extern bool SetForegroundWindow(IntPtr hwnd);
              [DllImport("user32.dll")] private static extern int GetSystemMetrics(int index);
              [DllImport("user32.dll")] private static extern void mouse_event(uint flags, int dx, int dy, uint data, UIntPtr extra);
              [DllImport("user32.dll")] private static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
              [DllImport("user32.dll")] private static extern IntPtr GetDC(IntPtr hwnd);
              [DllImport("user32.dll")] private static extern int ReleaseDC(IntPtr hwnd, IntPtr hdc);
              [DllImport("gdi32.dll")] private static extern bool BitBlt(IntPtr dest, int x, int y, int w, int h, IntPtr src, int sx, int sy, uint rop);

              public static POINT Origin(IntPtr hwnd) { var p = new POINT(); ClientToScreen(hwnd, ref p); return p; }
              public static void Activate(IntPtr hwnd) { SetForegroundWindow(hwnd); }
              public static void MoveTo(int x, int y)
              {
                  var w = GetSystemMetrics(0);
                  var h = GetSystemMetrics(1);
                  mouse_event(0x0001 | 0x8000, (int)Math.Round(x * 65535.0 / (w - 1)), (int)Math.Round(y * 65535.0 / (h - 1)), 0, UIntPtr.Zero);
              }
              public static void LeftDown() { mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero); }
              public static void LeftUp() { mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero); }
              public static void Key(byte vk) { keybd_event(vk, 0, 0, UIntPtr.Zero); keybd_event(vk, 0, 2, UIntPtr.Zero); }
              // 画面を写す。ドラッグ中の絵（別のウインドウ）も写るように CAPTUREBLT を付ける（System.Drawing では付けられない）
              public static void CopyScreen(IntPtr dest, int x, int y, int w, int h)
              {
                  var screen = GetDC(IntPtr.Zero);
                  try { BitBlt(dest, 0, 0, w, h, screen, x, y, 0x00CC0020 | 0x40000000); }
                  finally { ReleaseDC(IntPtr.Zero, screen); }
              }
          }
          '@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $uia = $true
          try {
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          } catch {
            $uia = $false
            Write-Host "::warning::UI オートメーションを読み込めないので、選べた数は画面写真で確かめてください: $_"
          }

          $exe = Join-Path $PWD 'publish\Hakobune-win-x64\Hakobune.exe'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList '--demo --theme light --size 1280x800' -PassThru
          $hwnd = [IntPtr]::Zero
          for ($i = 0; $i -lt 60 -and $hwnd -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            $hwnd = $p.MainWindowHandle
          }
          if ($hwnd -eq [IntPtr]::Zero) {
            Write-Error 'ウインドウが出ませんでした'
            exit 1
          }
          Start-Sleep -Seconds 5
          [Input]::Activate($hwnd)
          Start-Sleep -Milliseconds 500
          $origin = [Input]::Origin($hwnd)
          Write-Host "ウインドウの中身の左上: $($origin.X), $($origin.Y)"

          function Save-Window([string]$name) {
            $bmp = New-Object System.Drawing.Bitmap 1280, 800
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $hdc = $g.GetHdc()
            [Input]::CopyScreen($hdc, $origin.X, $origin.Y, 1280, 800)
            $g.ReleaseHdc($hdc)
            $bmp.Save((Join-Path $PWD "screenshots\$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()
          }
          function Move-To([double]$x, [double]$y) {
            [Input]::MoveTo([int]($origin.X + $x), [int]($origin.Y + $y))
          }
          function Drag-To([double]$fromX, [double]$fromY, [double]$toX, [double]$toY) {
            for ($i = 1; $i -le 25; $i++) {
              Move-To ($fromX + ($toX - $fromX) * $i / 25) ($fromY + ($toY - $fromY) * $i / 25)
              Start-Sleep -Milliseconds 20
            }
          }
          # 見出しの「13 項目・6 個を選択」などを読む
          function Get-Summary([string]$prefix) {
            if (-not $uia) {
              return $null
            }
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
            $condition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Text)
            foreach ($element in $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)) {
              $name = $element.Current.Name
              if ($name -and $name.StartsWith($prefix)) {
                return $name
              }
            }
            return '（見つかりません）'
          }
          $failed = $false
          function Test-Summary([string]$prefix, [string]$expected) {
            try {
              $summary = Get-Summary $prefix
            } catch {
              Write-Host "::warning::見出しを読めませんでした: $_"
              return
            }
            if ($null -eq $summary) {
              return
            }
            Write-Host "見出し: $summary"
            if (-not $summary.EndsWith($expected)) {
              Write-Host "::error::選べた数が違います（$expected のはず）: $summary"
              $script:failed = $true
            }
          }
          function Test-Alive([string]$after) {
            if ($p.HasExited) {
              Write-Host "::error::$after のあとでアプリが終了しました (終了コード $($p.ExitCode))"
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2 } -MaxEvents 5 -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "---- $($_.TimeCreated) $($_.ProviderName)"; Write-Host $_.Message }
              exit 1
            }
          }

          # 1. ローカルの一覧: 1 行目（css）の名前の右の空いている所から、6 行目（about.html）まで囲む
          Move-To 480 239
          Start-Sleep -Milliseconds 300
          [Input]::LeftDown()
          Drag-To 480 239 540 409
          Start-Sleep -Milliseconds 500
          Save-Window 'marquee-drag'
          [Input]::LeftUp()
          Start-Sleep -Milliseconds 700
          Save-Window 'marquee-done'
          Test-Alive '囲んで選ぶ'
          Test-Summary '13 項目' '6 個を選択'

          # 2. サーバーの一覧: 2 行目（images）の空いている所から、一覧の下の外まで引き、流れて最後の行まで選ばれるのを待つ
          Move-To 950 273
          Start-Sleep -Milliseconds 300
          [Input]::LeftDown()
          Drag-To 950 273 980 470
          Drag-To 980 470 980 560
          Start-Sleep -Milliseconds 1500
          Save-Window 'marquee-autoscroll'
          [Input]::LeftUp()
          Start-Sleep -Milliseconds 700
          # 一覧の外で離しても、枠は消える
          Save-Window 'marquee-autoscroll-done'
          Test-Alive '端の外まで引いて選ぶ'
          Test-Summary '11 項目' '10 個を選択'

          # 3. ローカルの一覧: 名前（index.html）を掴むと、これまでどおりファイルのドラッグになる。サーバー側の上で撮り、Esc でやめる
          Move-To 320 477
          Start-Sleep -Milliseconds 300
          [Input]::LeftDown()
          Drag-To 320 477 600 430
          Drag-To 600 430 900 380
          Start-Sleep -Milliseconds 800
          Save-Window 'drag-file'
          [Input]::Key(0x1B)
          Start-Sleep -Milliseconds 300
          [Input]::LeftUp()
          Start-Sleep -Milliseconds 700
          Test-Alive 'ファイルのドラッグ'

          Stop-Process -Id $p.Id -Force
          if ($failed) {
            exit 1
          }

      # 見本の通知（転送が終わりました）と、タスクバーのボタンの進み具合（見本は 76%）を、画面全体で撮る
      - name: 通知とタスクバーの画面写真
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Screen2
          {
              [DllImport("user32.dll")] private static extern IntPtr GetDC(IntPtr hwnd);
              [DllImport("user32.dll")] private static extern int ReleaseDC(IntPtr hwnd, IntPtr hdc);
              [DllImport("gdi32.dll")] private static extern bool BitBlt(IntPtr dest, int x, int y, int w, int h, IntPtr src, int sx, int sy, uint rop);
              [DllImport("user32.dll")] private static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
              public static void Key(byte vk, bool up) { keybd_event(vk, 0, up ? 2u : 0u, UIntPtr.Zero); }
              public static void CopyScreen(IntPtr dest, int w, int h)
              {
                  var screen = GetDC(IntPtr.Zero);
                  try { BitBlt(dest, 0, 0, w, h, screen, 0, 0, 0x00CC0020 | 0x40000000); }
                  finally { ReleaseDC(IntPtr.Zero, screen); }
              }
          }
          '@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $exe = Join-Path $PWD 'publish\Hakobune-win-x64\Hakobune.exe'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList '--demo --notify --theme light --size 1280x800' -PassThru
          $hwnd = [IntPtr]::Zero
          for ($i = 0; $i -lt 60 -and $hwnd -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            $hwnd = $p.MainWindowHandle
          }
          # 通知は 5 秒ほどで引っ込むので、出てすぐに撮る
          Start-Sleep -Seconds 3
          if ($p.HasExited) {
            Write-Host "::error::アプリが終了しました (終了コード $($p.ExitCode))"
            exit 1
          }
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $hdc = $g.GetHdc()
          [Screen2]::CopyScreen($hdc, $bounds.Width, $bounds.Height)
          $g.ReleaseHdc($hdc)
          $bmp.Save((Join-Path $PWD 'screenshots\notification.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()

          # 「応答不可」で通知が画面に出なくても、通知センター（Win+N）には入っているので、開いて撮る
          [Screen2]::Key(0x5B, $false); [Screen2]::Key(0x4E, $false); [Screen2]::Key(0x4E, $true); [Screen2]::Key(0x5B, $true)
          Start-Sleep -Seconds 2
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $hdc = $g.GetHdc()
          [Screen2]::CopyScreen($hdc, $bounds.Width, $bounds.Height)
          $g.ReleaseHdc($hdc)
          $bmp.Save((Join-Path $PWD 'screenshots\notification-center.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()
          [Screen2]::Key(0x1B, $false); [Screen2]::Key(0x1B, $true)
          Stop-Process -Id $p.Id -Force
          $status = Join-Path $env:LOCALAPPDATA 'Hakobune\notify-test.txt'
          if (Test-Path $status) {
            Write-Host "通知: $(Get-Content $status -Raw)"
          } else {
            Write-Host '::warning::通知の様子が書き出されていません'
          }

      - name: 画面写真を保存
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      # main の最新の画面写真を screenshots ブランチに置く（毎回上書き）。GitHub 上でも見られる。
      - name: 画面写真を screenshots ブランチに置く
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path screenshots)) {
            Write-Host '画面写真がありません'
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'screenshots-branch'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item screenshots\* $dir
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $lines = @('# 画面写真', '', "CI が自動で撮った、main の最新（$sha）の画面写真です。", '')
          foreach ($file in Get-ChildItem $dir -Filter *.png | Sort-Object Name) {
            $lines += "## $($file.BaseName)", '', "![$($file.BaseName)]($($file.Name))", ''
          }
          Set-Content -Path (Join-Path $dir 'README.md') -Encoding utf8 -Value $lines
          Set-Location $dir
          git init -q -b screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Screenshots for $sha"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" screenshots
